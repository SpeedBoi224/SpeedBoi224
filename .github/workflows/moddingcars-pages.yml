# Publishes the server-free build of moddingcars to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy moddingcars to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['moddingcars/**', '.github/workflows/moddingcars-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: moddingcars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moddingcars/dist
      - id: deployment
        uses: actions/deploy-pages@v4
