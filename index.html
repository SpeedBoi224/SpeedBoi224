<title>Vinny Throttle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&family=Special+Elite&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #1a110b;
    --dirt: #6b4428;
    --dirt-dark: #4e2f1a;
    --sand: #e9b872;
    --exhaust: #ff6a2b;
    --paper: #f4ecd8;
    --stamp: #d62828;
    --ink: #1a110b;
    --muted: #b89878;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --type: "Special Elite", "Courier New", Courier, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--paper); font-family: var(--mono); overflow: hidden; }
  #app { position: relative; height: 100%; width: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px;
    padding: 10px 16px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    background: linear-gradient(var(--ground), rgba(26,17,11,.85));
    border-bottom: 2px dashed var(--dirt);
    pointer-events: none;
  }
  #hud .meter { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 320px; }
  #hud .bar { flex: 1; height: 12px; background: var(--dirt-dark); border: 1px solid var(--sand); }
  #hud .bar i { display: block; height: 100%; width: 100%; background: var(--exhaust); transition: width .15s; }
  #hud .stat { color: var(--muted); white-space: nowrap; }
  #hud .stat b { color: var(--paper); font-weight: 600; font-variant-numeric: tabular-nums; }
  #hud .stat b.bad { color: var(--stamp); background: var(--paper); padding: 0 4px; }

  #screen {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 16px; background: rgba(26,17,11,.78);
  }
  .card {
    max-width: 520px; width: 100%; background: var(--paper); color: var(--ink);
    padding: 28px 24px; box-shadow: 8px 8px 0 var(--exhaust);
    transform: rotate(-1deg); display: grid; gap: 14px;
  }
  .card h1, .card h2 { font-family: var(--display); margin: 0; line-height: 1; text-wrap: balance; }
  .card h1 { font-size: clamp(34px, 9vw, 56px); color: var(--exhaust); text-shadow: 3px 3px 0 var(--ink); }
  .card h2 { font-size: clamp(24px, 6vw, 34px); }
  .card .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dirt); }
  .card p { margin: 0; font-family: var(--type); font-size: 16px; line-height: 1.45; }
  .card ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  .card .quote { border-left: 4px solid var(--stamp); padding-left: 12px; }
  .stamp {
    justify-self: start; font-family: var(--display); color: var(--stamp);
    border: 4px solid var(--stamp); padding: 4px 12px; font-size: 22px;
    transform: rotate(-6deg); opacity: .9;
  }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 13px; }
  .stats div { border-top: 1px solid var(--dirt); padding-top: 6px; }
  .stats b { display: block; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
  button.go {
    font-family: var(--display); font-size: 18px; padding: 14px 18px; cursor: pointer;
    background: var(--exhaust); color: var(--ink); border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  button.go:hover { background: var(--sand); }
  button.go:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--sand); outline-offset: 3px; }

  #kick {
    position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    font-family: var(--display); font-size: 16px; padding: 16px 18px;
    background: var(--stamp); color: var(--paper); border: 3px solid var(--paper); cursor: pointer;
  }
  #inter {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg);
    width: min(420px, calc(100% - 32px)); background: var(--paper); color: var(--ink);
    padding: 18px 20px; box-shadow: 6px 6px 0 var(--stamp); pointer-events: none;
    display: grid; gap: 8px; font-family: var(--type); font-size: 15px;
  }
  #inter h3 { margin: 0; font-family: var(--display); font-size: 22px; }
  #inter .denied { font-family: var(--display); color: var(--stamp); border: 3px solid var(--stamp); justify-self: start; padding: 2px 10px; transform: rotate(-4deg); }
</style>

<div id="app">
  <canvas id="c" aria-label="Vinny Throttle game area"></canvas>
  <div id="hud">
    <div class="meter"><span>Self-esteem</span><div class="bar"><i id="hEsteem"></i></div></div>
    <div class="stat">Wave <b id="hWave">0</b></div>
    <div class="stat">Rejections <b id="hRej">0</b></div>
    <div class="stat">Nose <b id="hNose">3.0 cm</b></div>
    <div class="stat">Friends <b id="hFriends">3</b></div>
    <div class="stat">Citizenship <b id="hCit">Pending</b></div>
  </div>
  <div id="inter" hidden></div>
  <button id="kick" hidden>KICK-START!</button>
  <div id="screen"></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const hud = $('hud'), screenEl = $('screen'), interEl = $('inter'), kickBtn = $('kick');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const R = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let W = 0, H = 0, DPR = 1, bg = null, arena = { x0: 0, y0: 0, x1: 0, y1: 0 };

  // ---------- Lines ----------
  const LINES = {
    bubble: ['Left on read', '"lol ok"', '"ew, dirtbikes?"', '"I have a boyfriend"', '"you\'re like a brother to me"', '"who is this?"', 'Seen ✓✓', '"my mom says no"'],
    letter: ['We regret to inform you…', '"not a good fit"', '"let\'s just be friends"', 'Return to sender', 'Unsubscribed', '"k"'],
    goblin: ['Form I-485: missing page 7', 'Wrong ink color', 'Signature outside box', 'Please resubmit', 'Biometrics appt: 2031', 'Fee increased'],
    stamp: ['DENIED', 'REJECTED', 'NOPE', 'RETURNED'],
    boss: ['APPLICATION DENIED', 'NEXT!', 'TAKE A NUMBER', 'VISA DENIED'],
  };
  const FRIENDS = ['Kyle', 'Dev', 'Big Mike'];
  const CRATES = [
    { name: 'Protein Peptide Stack', note: '+25 self-esteem', good: true, fn: p => { p.esteem = Math.min(100, p.esteem + 25); } },
    { name: 'Bike Speed Serum', note: 'Speed boost!', good: true, fn: p => { p.buff.speed = 6; } },
    { name: 'Triple Throw Peptide', note: 'Triple spark plugs!', good: true, fn: p => { p.buff.triple = 8; } },
    { name: 'Nose Reduction Cream', note: 'Nose shrinks', good: true, fn: p => { p.nose = Math.max(6, p.nose - 14); } },
    { name: 'Expired Powder (2019)', note: 'Bike stalled…', good: false, fn: p => { p.stall = 2.4; } },
    { name: 'Mystery Vial', note: 'Controls reversed!', good: false, fn: p => { p.buff.reverse = 5; } },
    { name: '"Nose Relief" (mislabeled)', note: 'Nose grows!', good: false, fn: p => { p.nose += 10; } },
  ];

  // ---------- State ----------
  let state = 'title', p, enemies, bullets, shots, crates, parts, pops, wave, queue, spawnT, spawnGap;
  let interT = 0, crateT = 0, shake = 0, banner = null, rejections = 0, kills = 0, friends = [];
  let best = 0;
  try { best = +localStorage.getItem('vinny-best') || 0; } catch (e) {}

  function reset() {
    p = { x: (arena.x0 + arena.x1) / 2, y: (arena.y0 + arena.y1) / 2, vx: 0, vy: 0, a: -Math.PI / 2, r: 14,
          esteem: 100, nose: 6, stall: 0, nextStall: R(6, 11), inv: 0, fireCd: 0,
          buff: { speed: 0, triple: 0, reverse: 0 } };
    enemies = []; bullets = []; shots = []; crates = []; parts = []; pops = [];
    wave = 0; queue = []; rejections = 0; kills = 0; friends = FRIENDS.slice();
    crateT = R(8, 12);
  }

  // ---------- Layout ----------
  function resize() {
    const r = cv.getBoundingClientRect();
    DPR = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    arena = { x0: 16, y0: hud.offsetHeight + 12, x1: W - 16, y1: H - 16 };
    buildBg();
    if (p) { p.x = clamp(p.x, arena.x0 + 20, arena.x1 - 20); p.y = clamp(p.y, arena.y0 + 20, arena.y1 - 20); }
  }
  function buildBg() {
    bg = document.createElement('canvas');
    bg.width = W * DPR; bg.height = H * DPR;
    const g = bg.getContext('2d');
    g.scale(DPR, DPR);
    g.fillStyle = '#1a110b'; g.fillRect(0, 0, W, H);
    const { x0, y0, x1, y1 } = arena;
    g.fillStyle = '#6b4428'; g.fillRect(x0, y0, x1 - x0, y1 - y0);
    for (let i = 0; i < (W * H) / 260; i++) {
      g.fillStyle = pick(['#5e3b22', '#7a5032', '#4e2f1a', '#83593a']);
      g.fillRect(R(x0, x1), R(y0, y1), R(1, 3), R(1, 3));
    }
    for (let i = 0; i < 14; i++) {
      g.fillStyle = 'rgba(40,24,12,.25)';
      g.beginPath(); g.ellipse(R(x0, x1), R(y0, y1), R(20, 70), R(10, 40), R(0, 3), 0, Math.PI * 2); g.fill();
    }
    g.lineWidth = 3; g.strokeStyle = 'rgba(30,18,8,.28)';
    for (let i = 0; i < 7; i++) {
      const sx = R(x0, x1), sy = R(y0, y1), ex = R(x0, x1), ey = R(y0, y1), cx = R(x0, x1), cy = R(y0, y1);
      for (const off of [-5, 5]) {
        g.beginPath(); g.moveTo(sx + off, sy); g.quadraticCurveTo(cx + off, cy, ex + off, ey); g.stroke();
      }
    }
    g.setLineDash([14, 8]); g.lineWidth = 4; g.strokeStyle = '#e9b872';
    g.strokeRect(x0 + 2, y0 + 2, x1 - x0 - 4, y1 - y0 - 4);
  }

  // ---------- Input ----------
  const keys = {};
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); kick(); }
    if (e.code.startsWith('Arrow')) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  let joy = null;
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' && state !== 'inter') return;
    joy = { ox: e.clientX, oy: e.clientY, dx: 0, dy: 0, id: e.pointerId };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => { if (joy && e.pointerId === joy.id) { joy.dx = e.clientX - joy.ox; joy.dy = e.clientY - joy.oy; } });
  const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
  cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
  kickBtn.addEventListener('click', kick);

  function kick() {
    if ((state === 'play' || state === 'inter') && p.stall > 0) {
      p.stall -= 0.6;
      pop(p.x + R(-20, 20), p.y - 26, pick(['*kick*', '*KICK*', 'come ON', 'vrrr… no']), '#e9b872', 14);
      for (let i = 0; i < 5; i++) parts.push({ x: p.x, y: p.y, vx: R(-60, 60), vy: R(-60, 60), life: .5, max: .5, c: '#9a8a7a', s: R(3, 6) });
    }
  }

  // ---------- Helpers ----------
  function pop(x, y, text, color = '#f4ecd8', size = 16, font = 'type') {
    pops.push({ x: clamp(x, 110, W - 110), y, text, color, size, font, t: 0, life: 1.6 });
  }
  function burst(x, y, c, n = 10, sp = 160) {
    for (let i = 0; i < n; i++) {
      const a = R(0, Math.PI * 2), s = R(sp * .3, sp);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: R(.3, .7), max: .7, c, s: R(2, 5) });
    }
  }
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  function noseTip() { const L = 10 + p.nose; return { x: p.x + Math.cos(p.a) * L, y: p.y + Math.sin(p.a) * L }; }

  // ---------- Waves ----------
  const TYPES = {
    bubble: { r: 15, hp: 2, spd: 78, dmg: 9, c: '#f4ecd8' },
    letter: { r: 11, hp: 1, spd: 150, dmg: 7, c: '#f4ecd8' },
    goblin: { r: 20, hp: 6, spd: 46, dmg: 13, c: '#e9b872' },
    boss:   { r: 46, hp: 60, spd: 34, dmg: 24, c: '#d62828' },
  };
  function spawn(type) {
    const T = TYPES[type], side = (Math.random() * 4) | 0;
    let x, y;
    if (side === 0) { x = R(arena.x0, arena.x1); y = arena.y0 - 30; }
    else if (side === 1) { x = R(arena.x0, arena.x1); y = arena.y1 + 30; }
    else if (side === 2) { x = arena.x0 - 30; y = R(arena.y0, arena.y1); }
    else { x = arena.x1 + 30; y = R(arena.y0, arena.y1); }
    const scale = 1 + (wave - 1) * 0.1;
    const hp = type === 'boss' ? T.hp + wave * 12 : Math.ceil(T.hp * scale);
    enemies.push({ type, x, y, r: T.r, hp, max: hp, spd: T.spd + wave * 2, dmg: T.dmg, t: R(0, 6), cd: R(1.5, 3), cd2: 1.5, flash: 0 });
    if (type === 'boss') pop(W / 2, arena.y0 + 50, 'THE VISA OFFICER HAS ENTERED', '#d62828', 22, 'display');
  }
  function startWave() {
    wave++;
    queue = [];
    const n = 4 + wave * 3;
    if (wave % 5 === 0) queue.push('boss');
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      queue.push(wave >= 3 && r < 0.18 ? 'goblin' : wave >= 2 && r < 0.5 ? 'letter' : 'bubble');
    }
    spawnGap = Math.max(0.28, 1.0 - wave * 0.06);
    spawnT = 0.6;
    state = 'play';
    interEl.hidden = true;
    banner = { text: wave % 5 === 0 ? `WAVE ${wave}: BOSS` : `WAVE ${wave}`, t: 0 };
  }
  function endWave() {
    state = 'inter'; interT = 3.6;
    p.esteem = Math.min(100, p.esteem + 12);
    const lost = friends.shift();
    const friendLine = lost ? `${lost} unfollowed you. Friends left: ${friends.length}.` : 'Nobody left to unfollow you. Friends: still 0.';
    interEl.innerHTML = `<h3>Wave ${wave} survived</h3>
      <div>USCIS case update — application #${wave}:</div>
      <div class="denied">REJECTED</div>
      <div>${friendLine}</div>
      <div>+12 self-esteem for surviving. Barely.</div>`;
    interEl.hidden = false;
  }
  function gameOver() {
    state = 'over';
    kickBtn.hidden = true; interEl.hidden = true;
    const survived = Math.max(0, wave - 1);
    if (survived > best) { best = survived; try { localStorage.setItem('vinny-best', best); } catch (e) {} }
    screenEl.innerHTML = `<div class="card">
      <div class="kicker">Family meeting — living room — right now</div>
      <h2>One-way ticket booked</h2>
      <div class="stamp">SENT TO INDIA</div>
      <p class="quote">"Beta, enough with the dirtbike. Enough with the internet powders. You are going to Nani's house until you figure yourself out." — Mom &amp; Dad</p>
      <p>Vinny has lost himself.</p>
      <div class="stats">
        <div>Waves survived<b>${survived}</b></div>
        <div>Rejections<b>${rejections}</b></div>
        <div>Final nose length<b>${(p.nose / 2).toFixed(1)} cm</b></div>
        <div>Friends<b>0</b></div>
        <div>Haters defeated<b>${kills}</b></div>
        <div>Best run<b>${best} waves</b></div>
      </div>
      <button class="go" id="again">Beg for one more chance</button>
    </div>`;
    screenEl.hidden = false;
    $('again').addEventListener('click', start);
    $('again').focus();
  }
  function start() {
    reset();
    screenEl.hidden = true;
    startWave();
  }
  function title() {
    screenEl.innerHTML = `<div class="card">
      <div class="kicker">Worst dirtbike rider in the tri-county area</div>
      <h1>Vinny Throttle</h1>
      <p>Vinny wants three things: a bike that starts, a U.S. citizenship, and one (1) girl who texts back. He is getting none of them.</p>
      <ul>
        <li><b>Drive:</b> WASD / arrow keys, or drag anywhere on touch.</li>
        <li><b>Throw spark plugs:</b> automatic. Aim is not Vinny's strong suit.</li>
        <li><b>Kick-start:</b> SPACE (or the button) when the trash bike stalls.</li>
        <li><b>IndyaMart crates:</b> "peptides." Results may vary. Wildly.</li>
        <li>Every rejection grows his nose — and a longer nose is a bigger target.</li>
        <li>Run out of self-esteem and Mom &amp; Dad take over.</li>
      </ul>
      ${best ? `<div class="kicker">Best run: ${best} waves</div>` : ''}
      <button class="go" id="startBtn">Twist the throttle</button>
    </div>`;
    $('startBtn').addEventListener('click', start);
  }

  // ---------- Update ----------
  function hurt(dmg, line) {
    if (p.inv > 0) return;
    p.esteem -= dmg; p.nose += 4; rejections++; p.inv = 0.9;
    shake = reduceMotion ? 0 : 10;
    pop(p.x, p.y - 34, line, '#f4ecd8', 16);
    burst(p.x, p.y, '#d62828', 12);
    if (p.esteem <= 0) { p.esteem = 0; gameOver(); }
  }

  function update(dt) {
    // player
    let ix = 0, iy = 0;
    if (keys.KeyA || keys.ArrowLeft) ix--;
    if (keys.KeyD || keys.ArrowRight) ix++;
    if (keys.KeyW || keys.ArrowUp) iy--;
    if (keys.KeyS || keys.ArrowDown) iy++;
    if (joy) { const m = Math.hypot(joy.dx, joy.dy); if (m > 8) { ix = joy.dx / Math.max(m, 50); iy = joy.dy / Math.max(m, 50); } }
    const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
    if (p.buff.reverse > 0) { ix = -ix; iy = -iy; }
    if (p.stall > 0) { ix = iy = 0; p.stall -= dt; if (Math.random() < dt * 12) parts.push({ x: p.x - Math.cos(p.a) * 16, y: p.y - Math.sin(p.a) * 16, vx: R(-20, 20), vy: R(-50, -20), life: .9, max: .9, c: '#3a3330', s: R(5, 9) }); }
    const acc = 700 * (p.buff.speed > 0 ? 1.6 : 1);
    p.vx += ix * acc * dt; p.vy += iy * acc * dt;
    const fr = Math.pow(0.08, dt); p.vx *= fr; p.vy *= fr;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < arena.x0 + 16 || p.x > arena.x1 - 16) p.vx *= -0.5;
    if (p.y < arena.y0 + 16 || p.y > arena.y1 - 16) p.vy *= -0.5;
    p.x = clamp(p.x, arena.x0 + 16, arena.x1 - 16); p.y = clamp(p.y, arena.y0 + 16, arena.y1 - 16);
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 30) {
      const ta = Math.atan2(p.vy, p.vx);
      let d = ta - p.a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
      p.a += d * (1 - Math.pow(0.0005, dt));
      if (Math.random() < dt * 30) parts.push({ x: p.x - Math.cos(p.a) * 16, y: p.y - Math.sin(p.a) * 16, vx: R(-30, 30), vy: R(-30, 30), life: .6, max: .6, c: '#a0764e', s: R(3, 7) });
      p.nextStall -= dt;
      if (p.nextStall <= 0 && p.stall <= 0) {
        p.stall = 1.6; p.nextStall = R(7, 14);
        pop(p.x, p.y - 40, 'ENGINE STALLED', '#ff6a2b', 18, 'display');
      }
    }
    p.inv -= dt;
    for (const k in p.buff) p.buff[k] = Math.max(0, p.buff[k] - dt);
    kickBtn.hidden = !(p.stall > 0);

    // firing
    p.fireCd -= dt;
    if (p.fireCd <= 0) {
      let t = null, td = 440;
      for (const e of enemies) { const d = Math.hypot(e.x - p.x, e.y - p.y); if (d < td) { td = d; t = e; } }
      if (t) {
        const a = Math.atan2(t.y - p.y, t.x - p.x) + R(-0.12, 0.12);
        for (const s of p.buff.triple > 0 ? [-0.22, 0, 0.22] : [0])
          bullets.push({ x: p.x, y: p.y, vx: Math.cos(a + s) * 560, vy: Math.sin(a + s) * 560, life: 0.9, rot: R(0, 6) });
        p.fireCd = 0.32;
      }
    }

    // spawning
    if (state === 'play') {
      if (queue.length) { spawnT -= dt; if (spawnT <= 0) { spawn(queue.shift()); spawnT = spawnGap; } }
      else if (!enemies.length) endWave();
    } else if (state === 'inter') {
      interT -= dt; if (interT <= 0) startWave();
    }

    // crates
    crateT -= dt;
    if (crateT <= 0) {
      crateT = R(11, 17);
      crates.push({ x: R(arena.x0 + 40, arena.x1 - 40), y: R(arena.y0 + 40, arena.y1 - 40), life: 10, drop: 0.6 });
    }
    for (let i = crates.length - 1; i >= 0; i--) {
      const c = crates[i]; c.life -= dt; c.drop = Math.max(0, c.drop - dt);
      if (c.life <= 0) { crates.splice(i, 1); continue; }
      if (c.drop <= 0 && Math.hypot(c.x - p.x, c.y - p.y) < 30) {
        const eff = pick(CRATES); eff.fn(p); crates.splice(i, 1);
        pop(c.x, c.y - 24, `IndyaMart: ${eff.name}`, eff.good ? '#e9b872' : '#ff6a2b', 15, 'mono');
        pop(c.x, c.y - 4, eff.note, eff.good ? '#f4ecd8' : '#d62828', 18, 'display');
        burst(c.x, c.y, eff.good ? '#e9b872' : '#7fd13b', 16);
      }
    }

    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; b.rot += dt * 18;
      let hit = false;
      for (const e of enemies) {
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 4) {
          e.hp--; e.flash = 0.1; hit = true; burst(b.x, b.y, '#e9b872', 4, 90); break;
        }
      }
      if (hit || b.life <= 0) bullets.splice(i, 1);
    }

    // enemies
    const tip = noseTip();
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.hp <= 0) {
        kills++; burst(e.x, e.y, e.type === 'boss' ? '#d62828' : '#f4ecd8', e.type === 'boss' ? 40 : 12);
        if (e.type === 'boss') pop(e.x, e.y, 'Visa Officer went on lunch break', '#e9b872', 18);
        enemies.splice(i, 1); continue;
      }
      e.t += dt; e.flash -= dt;
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      if (e.type === 'letter') {
        const w = Math.sin(e.t * 6) * 0.9;
        e.x += (ux - uy * w) * e.spd * dt; e.y += (uy + ux * w) * e.spd * dt;
      } else { e.x += ux * e.spd * dt; e.y += uy * e.spd * dt; }
      if (e.type === 'goblin') {
        e.cd -= dt;
        if (e.cd <= 0 && d < 520) { e.cd = R(2.5, 4); shots.push({ x: e.x, y: e.y, vx: ux * 190, vy: uy * 190, life: 4, txt: pick(LINES.stamp) }); }
      }
      if (e.type === 'boss') {
        e.cd -= dt; e.cd2 -= dt;
        if (e.cd <= 0) {
          e.cd = 3; const n = 12, off = R(0, 1);
          for (let k = 0; k < n; k++) { const a = off + k / n * Math.PI * 2; shots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, life: 5, txt: 'DENIED' }); }
          pop(e.x, e.y - 60, pick(LINES.boss), '#d62828', 20, 'display');
          shake = reduceMotion ? 0 : 6;
        }
        if (e.cd2 <= 0) { e.cd2 = 1.4; shots.push({ x: e.x, y: e.y, vx: ux * 230, vy: uy * 230, life: 4, txt: 'NEXT!' }); }
      }
      // collision: body or nose
      const bodyHit = d < e.r + p.r * 0.8;
      const noseHit = segDist(e.x, e.y, p.x, p.y, tip.x, tip.y) < e.r + 3;
      if ((bodyHit || noseHit) && p.inv <= 0 && state !== 'over') {
        let line = pick(LINES[e.type]);
        if (noseHit && !bodyHit && Math.random() < 0.5) line = 'Right in the nose!';
        hurt(e.dmg, line);
        if (e.type === 'letter') { e.hp = 0; }
        else { e.x -= ux * 30; e.y -= uy * 30; }
      }
    }

    // enemy shots
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      const hit = Math.hypot(s.x - p.x, s.y - p.y) < p.r + 8 || segDist(s.x, s.y, p.x, p.y, tip.x, tip.y) < 9;
      if (hit && p.inv <= 0 && state !== 'over') { hurt(9, pick(LINES.goblin)); shots.splice(i, 1); continue; }
      if (s.life <= 0) shots.splice(i, 1);
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.life -= dt;
      if (q.life <= 0) parts.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) { const q = pops[i]; q.t += dt; q.y -= 22 * dt; if (q.t > q.life) pops.splice(i, 1); }
    if (banner) { banner.t += dt; if (banner.t > 1.8) banner = null; }
    shake *= Math.pow(0.02, dt);
  }

  // ---------- Draw ----------
  function drawVinny() {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0) ctx.globalAlpha = 0.45;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(2, 4, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
    // wheels
    ctx.fillStyle = '#111';
    ctx.fillRect(-22, -3.5, 12, 7); ctx.fillRect(10, -3.5, 12, 7);
    // frame (faded orange, dented)
    ctx.fillStyle = '#c4501f'; ctx.fillRect(-14, -4, 26, 8);
    ctx.fillStyle = '#8a3614'; ctx.fillRect(-4, -4, 4, 8);
    // exhaust pipe with duct tape
    ctx.fillStyle = '#9a9a9a'; ctx.fillRect(-18, 4, 12, 3);
    ctx.fillStyle = '#c9c9c9'; ctx.fillRect(-13, 4, 3, 3);
    // handlebars
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(9, -11); ctx.lineTo(9, 11); ctx.stroke();
    // body / arms
    ctx.fillStyle = '#2f5d8a'; ctx.beginPath(); ctx.ellipse(-2, 0, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
    // nose (grows)
    const L = p.nose;
    ctx.fillStyle = '#d99a6c'; ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(8, -3, L + 2, 6, 3); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(10 + L, 0, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // helmet
    ctx.fillStyle = '#ff6a2b'; ctx.beginPath(); ctx.arc(4, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a110b'; ctx.fillRect(7, -5, 3, 10);
    ctx.fillStyle = '#f4ecd8'; ctx.fillRect(-2, -1.5, 10, 3);
    ctx.restore();
    if (p.stall > 0) text('STALLED', p.x, p.y - 30, '#ff6a2b', 12, 'display');
  }
  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    const flash = e.flash > 0;
    if (e.type === 'bubble') {
      ctx.fillStyle = flash ? '#ff6a2b' : '#f4ecd8'; ctx.strokeStyle = '#1a110b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(-18, -13, 36, 24, 10); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(-14, 18); ctx.lineTo(0, 11); ctx.fill();
      ctx.fillStyle = '#1a110b';
      if (Math.sin(e.t * 2) > 0) { for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 8, -1, 2.5, 0, Math.PI * 2); ctx.fill(); } }
      else { ctx.font = '600 9px ' + fontFam('mono'); ctx.textAlign = 'center'; ctx.fillText('Seen ✓✓', 0, 2); }
    } else if (e.type === 'letter') {
      ctx.rotate(Math.sin(e.t * 6) * 0.4);
      ctx.fillStyle = flash ? '#ff6a2b' : '#f4ecd8'; ctx.strokeStyle = '#1a110b'; ctx.lineWidth = 1.5;
      ctx.fillRect(-13, -9, 26, 18); ctx.strokeRect(-13, -9, 26, 18);
      ctx.beginPath(); ctx.moveTo(-13, -9); ctx.lineTo(0, 2); ctx.lineTo(13, -9); ctx.stroke();
      ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.arc(0, 2, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'goblin') {
      for (let i = 2; i >= 0; i--) {
        ctx.fillStyle = flash ? '#ff6a2b' : ['#f4ecd8', '#e6dcc4', '#d8cbb0'][i];
        ctx.fillRect(-18 + i * 3, -22 + i * 3, 36, 44); ctx.strokeStyle = '#1a110b'; ctx.lineWidth = 1.5; ctx.strokeRect(-18 + i * 3, -22 + i * 3, 36, 44);
      }
      ctx.fillStyle = '#1a110b'; ctx.font = '11px ' + fontFam('display'); ctx.textAlign = 'center'; ctx.fillText('I-485', 0, -8);
      ctx.fillStyle = '#d62828';
      ctx.beginPath(); ctx.moveTo(-10, 2); ctx.lineTo(-3, 6); ctx.lineTo(-10, 8); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(3, 6); ctx.lineTo(10, 8); ctx.fill();
      ctx.fillStyle = '#1a110b'; ctx.fillRect(-7, 13, 14, 2);
    } else if (e.type === 'boss') {
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(4, 8, 56, 40, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = flash ? '#ff6a2b' : '#5a3a26'; ctx.strokeStyle = '#1a110b'; ctx.lineWidth = 3;
      ctx.fillRect(-52, -30, 104, 60); ctx.strokeRect(-52, -30, 104, 60);
      ctx.fillStyle = '#f4ecd8'; ctx.fillRect(-40, 8, 80, 16);
      ctx.fillStyle = '#1a110b'; ctx.font = '10px ' + fontFam('display'); ctx.textAlign = 'center'; ctx.fillText('VISA OFFICER', 0, 20);
      ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(0, -12, 14, 0, Math.PI * 2); ctx.fill();
      const arm = Math.max(0, Math.sin(e.t * 5)) * 10;
      ctx.fillStyle = '#d62828'; ctx.fillRect(22, -24 + arm, 20, 14);
      ctx.fillStyle = '#1a110b'; ctx.fillRect(29, -38 + arm, 6, 14);
      // hp bar
      ctx.fillStyle = '#1a110b'; ctx.fillRect(-52, -44, 104, 7);
      ctx.fillStyle = '#d62828'; ctx.fillRect(-51, -43, 102 * (e.hp / e.max), 5);
    }
    ctx.restore();
  }
  const famCache = {};
  function fontFam(k) {
    if (!famCache[k]) famCache[k] = getComputedStyle(document.documentElement).getPropertyValue('--' + k).trim();
    return famCache[k];
  }
  function text(t, x, y, color, size, font = 'type', alpha = 1) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.font = `${font === 'mono' ? '600 ' : ''}${size}px ${fontFam(font)}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = '#1a110b'; ctx.strokeText(t, x, y);
    ctx.fillStyle = color; ctx.fillText(t, x, y);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();
    if (shake > 0.3) ctx.translate(R(-shake, shake), R(-shake, shake));
    if (bg) ctx.drawImage(bg, 0, 0, W, H);
    if (!p) { ctx.restore(); return; }

    for (const c of crates) {
      const y = c.y - c.drop * 200;
      const blink = c.life < 3 && Math.floor(c.life * 6) % 2 === 0;
      if (blink) continue;
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(c.x, c.y + 12, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b07a44'; ctx.strokeStyle = '#1a110b'; ctx.lineWidth = 2;
      ctx.fillRect(c.x - 15, y - 13, 30, 26); ctx.strokeRect(c.x - 15, y - 13, 30, 26);
      ctx.fillStyle = '#d9c7a0'; ctx.fillRect(c.x - 15, y - 3, 30, 5);
      text('?', c.x, y + 1, '#1a110b', 14, 'display');
      text('IndyaMart', c.x, y - 22, '#e9b872', 10, 'mono');
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s); }
    ctx.globalAlpha = 1;
    for (const e of enemies) drawEnemy(e);
    for (const b of bullets) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = '#c9c9c9'; ctx.fillRect(-6, -2, 8, 4); ctx.fillStyle = '#f4ecd8'; ctx.fillRect(2, -2.5, 4, 5);
      ctx.restore();
    }
    for (const s of shots) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(-0.2);
      ctx.fillStyle = '#f4ecd8'; ctx.strokeStyle = '#d62828'; ctx.lineWidth = 2;
      ctx.fillRect(-20, -8, 40, 16); ctx.strokeRect(-20, -8, 40, 16);
      ctx.fillStyle = '#d62828'; ctx.font = '8px ' + fontFam('display'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.txt, 0, 1);
      ctx.restore();
    }
    drawVinny();
    for (const q of pops) text(q.text, q.x, q.y, q.color, q.size, q.font, Math.min(1, (q.life - q.t) * 2));

    // buffs
    const active = [];
    if (p.buff.speed > 0) active.push(`SPEED ${p.buff.speed.toFixed(1)}s`);
    if (p.buff.triple > 0) active.push(`TRIPLE ${p.buff.triple.toFixed(1)}s`);
    if (p.buff.reverse > 0) active.push(`REVERSED ${p.buff.reverse.toFixed(1)}s`);
    ctx.textAlign = 'left';
    active.forEach((t, i) => { ctx.font = `600 12px ${fontFam('mono')}`; ctx.fillStyle = t.startsWith('REV') ? '#ff6a2b' : '#e9b872'; ctx.fillText(t, arena.x0 + 10, arena.y1 - 12 - i * 16); });

    if (banner) {
      const a = banner.t < 0.3 ? banner.t / 0.3 : Math.max(0, 1 - (banner.t - 1.2) / 0.6);
      text(banner.text, W / 2, (arena.y0 + arena.y1) / 2 - 80, '#ff6a2b', Math.min(56, W / 9), 'display', a);
    }
    ctx.restore();
  }

  function syncHud() {
    if (!p) return;
    $('hEsteem').style.width = p.esteem + '%';
    $('hWave').textContent = wave;
    $('hRej').textContent = rejections;
    $('hNose').textContent = (p.nose / 2).toFixed(1) + ' cm';
    $('hFriends').textContent = friends.length;
    const cit = $('hCit');
    const denied = wave > 1 || state === 'inter' || state === 'over';
    cit.textContent = denied ? `Rejected ×${Math.max(1, wave - (state === 'inter' ? 0 : 1))}` : 'Pending';
    cit.className = denied ? 'bad' : '';
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'play' || state === 'inter') update(dt);
    else if (p) { for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > pops[i].life) pops.splice(i, 1); } }
    draw(); syncHud();
    requestAnimationFrame(loop);
  }

  addEventListener('resize', resize);
  resize();
  title();
  requestAnimationFrame(loop);
})();
</script>
